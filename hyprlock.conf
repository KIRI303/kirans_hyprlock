general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/kiran/Pictures/Wallpapers/red.png
    blur_passes = 2
    blur_size = 2
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 12

    placeholder_text = Enter password...
    fail_text = Incorrect password

    outer_color = rgba(180, 190, 254, 1.0)
    inner_color = rgba(30, 30, 46, 0.9)
    font_color = rgba(205, 214, 244, 1.0)
}

image {
    monitor =
    path = /home/kiran/Pictures/fastfetch/blue-circle.png
    size = 80
    rounding = 40
    border_size = 0
    position = 0, 55
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = おかえり, 七転び八起き
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 100
    font_family = Comfortaa
    position = 0, 240
    halign = center
    valign = center
}

# Date below the clock
label {
    monitor =
    text = cmd[update:60000]    date +"%A, %d %B %Y"
    color = rgba(255, 255, 255, 1.0)
    font_size = 28
    font_family = Monsieur La Doulaise
    position = 0, 145
    halign = center
    valign = center
}
